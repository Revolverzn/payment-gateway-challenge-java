spring.application.name=payment-gateway
server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

springdoc.info.title=Payment Gateway API
springdoc.info.version=0.0.1-SNAPSHOT
springdoc.info.description=Process card payments via the acquiring bank simulator and retrieve stored payments.

bank.simulator.url=http://localhost:8080/payments
bank.connect-timeout-ms=2000
bank.read-timeout-ms=5000

liteflow.rule-source=config/liteflow/*.xml
liteflow.print-execution-log=false

management.endpoints.web.exposure.include=health,info,metrics,httpexchanges,prometheus
management.endpoint.health.show-details=always

# Bounded in-memory journal behind /actuator/httpexchanges
observability.http-exchanges.capacity=1000
